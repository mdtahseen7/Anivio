name: Build APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or full commit SHA to build'
        required: true
        default: 'cmp-rewrite'
      arch:
        description: 'CPU architecture for native libraries'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's stale default ("tools platform-tools"):
          # the legacy "tools" package no longer exists and makes sdkmanager fail.
          packages: platform-tools build-tools;37.0.0 platforms;android-37

      - name: Build debug APK (${{ inputs.arch }})
        run: ./gradlew :androidApp:assembleFullDebug "-PanivioAbi=${{ inputs.arch }}" --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anivio-${{ inputs.arch }}-${{ github.sha }}
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
