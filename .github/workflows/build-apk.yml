name: Build APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or full commit SHA to build'
        required: true
        default: 'cmp-rewrite'
      arch:
        description: 'CPU architecture for native libraries'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - all
      build_type:
        description: 'Build type (release = minified + smaller, like a laptop build)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the APK as a GitHub Release
    steps:
      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle caching
        # Caches Gradle dependencies + build outputs between runs so CI builds
        # stop starting from zero every time (the main reason CI was ~35 min
        # vs ~4 min on a warm laptop).
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the action's stale default ("tools platform-tools"):
          # the legacy "tools" package no longer exists and makes sdkmanager fail.
          packages: platform-tools build-tools;37.0.0

      - name: Install android-37 platform (missing from sdkmanager repo index)
        run: |
          curl -sSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          unzip -q -o /tmp/platform-37.zip -d "$ANDROID_SDK_ROOT/platforms"
          # zip's top-level dir is android-37.0; Gradle expects android-37
          mv "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

      - name: Create local.properties (CI stub)
        run: |
          # generateRuntimeConfigs validates that this file exists; values fall
          # back to env vars (blank in CI), which the app handles gracefully.
          touch local.properties

      - name: Build APK (${{ inputs.arch }}, ${{ inputs.build_type }})
        run: |
          TYPE="${{ inputs.build_type }}"
          TASK="assembleFull$(tr '[:lower:]' '[:upper:]' <<< "${TYPE:0:1}")${TYPE:1}"
          ./gradlew ":androidApp:$TASK" "-PanivioAbi=${{ inputs.arch }}" -PanivioCiBuild=true --console=plain

      - name: Publish raw APK as GitHub Release (no zip)
        # GitHub Action artifacts are always zipped; attaching the APK to a
        # release gives a direct raw .apk download link instead.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_DIR="androidApp/build/outputs/apk/full/${{ inputs.build_type }}"
          ls "$APK_DIR"/*.apk
          TAG="ci-${{ inputs.arch }}-${{ github.run_id }}"
          gh release create "$TAG" \
            --prerelease \
            --title "CI ${{ inputs.build_type }} build · ${{ inputs.arch }} · ${GITHUB_SHA:0:7}" \
            --notes "Automated CI build of \`${{ inputs.ref }}\` (${GITHUB_SHA}). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "$APK_DIR"/*.apk
