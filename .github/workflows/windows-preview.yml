name: Build Windows installer

on:
  push:
    branches: [codex/windows-preview]
    tags: ['v*windows']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: mdtahseen7/Anivio/.github/workflows/windows-package.yml@cmp-rewrite
    with:
      source_ref: ${{ github.sha }}
    secrets: inherit

  release:
    name: Stage the stable Windows release
    if: ${{ github.ref_type == 'tag' && endsWith(github.ref_name, '+windows') }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check the Windows version
        run: |
          desktop_version="$(sed -n 's/^VERSION_NAME=//p' composeApp/Configuration/DesktopVersion.properties | tr -d '\r')"
          if [[ "$GITHUB_REF_NAME" != "v${desktop_version}+windows" ]]; then
            echo 'The Windows tag must match DesktopVersion.properties.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: Anivio-Windows-x64
          path: windows-release
      - name: Attach the verified installer to a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd windows-release && tr -d '\r' < SHA256SUMS.txt | sha256sum --check)
          version="${GITHUB_REF_NAME#v}"
          version="${version%+windows}"
          gh release create "$GITHUB_REF_NAME" windows-release/Anivio-Windows-x64.exe windows-release/SHA256SUMS.txt \
            --verify-tag --draft --latest=false --title "Anivio for Windows $version" \
            --notes-file composeApp/installer/windows/release-notes.md
