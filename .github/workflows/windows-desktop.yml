name: Windows desktop

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-desktop

permissions:
  contents: read

jobs:
  desktop:
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare native dependencies
        shell: pwsh
        run: |
          $assets = ./scripts/windows/prepare-runtimes.ps1
          "ANIVIO_MPV_DIRECTORY=$($assets.LibMpvDirectory)" >> $env:GITHUB_ENV
          "ANIVIO_WEBVIEW2_DIRECTORY=$($assets.WebView2Directory)" >> $env:GITHUB_ENV
          "ANIVIO_TORRSERVER_EXECUTABLE=$($assets.TorrServerExecutable)" >> $env:GITHUB_ENV
          if (!(Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Join-Path "${env:ProgramFiles(x86)}" 'WiX Toolset v3.14/bin'
            if (!(Test-Path -LiteralPath (Join-Path $wix 'candle.exe'))) {
              throw 'WiX 3.14 was not available on the Windows runner.'
            }
            $wix >> $env:GITHUB_PATH
          }

      - name: Configure Anivio backend
        shell: pwsh
        env:
          ANIVIO_PROPERTIES: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if ($env:ANIVIO_PROPERTIES) {
            $properties = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:ANIVIO_PROPERTIES))
            $properties -split '\r?\n' |
              Where-Object { $_ -notmatch '^\s*(sdk\.dir|NUVIO_RELEASE_[A-Z_]+)\s*[:=]' } |
              Set-Content -LiteralPath local.properties -Encoding utf8NoBOM
          }

      - name: Test and package
        shell: pwsh
        run: |
          $options = @(
            '-Panivio.desktop=true'
            "-Pnuvio.windows.libmpv.runtimeDir=$env:ANIVIO_MPV_DIRECTORY"
            "-Pnuvio.webview2.dir=$env:ANIVIO_WEBVIEW2_DIRECTORY"
            "-Panivio.desktop.torrServer=$env:ANIVIO_TORRSERVER_EXECUTABLE"
          )
          ./gradlew.bat @options :composeApp:desktopTest :composeApp:packageReleaseExe --no-configuration-cache
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Anivio-Windows-x64
          path: composeApp/build/compose/binaries/main-release/exe/*.exe
          if-no-files-found: error
